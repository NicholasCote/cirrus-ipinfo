# maintain → refresh → sync-tenants → collect (Loki via Grafana) → enrich → load → maintain
# Run it now:  kubectl create job -n <ns> --from=cronjob/{{ include "ipinfo.fullname" . }}-nightly ipinfo-manual-$(date +%s)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ipinfo.fullname" . }}-nightly
  labels: {{- include "ipinfo.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.nightly.schedule | quote }}
  timeZone: Etc/UTC
  suspend: {{ .Values.nightly.suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 7200
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.nightly.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cirrus-ipinfo
            app.kubernetes.io/component: nightly
        spec:
          serviceAccountName: {{ include "ipinfo.fullname" . }}-pipeline
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext: {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: nightly
              image: {{ include "ipinfo.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["nightly"]
              {{- include "ipinfo.env" . | nindent 14 }}
              resources: {{- toYaml .Values.nightly.resources | nindent 16 }}
              securityContext: {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: work
              emptyDir: {sizeLimit: {{ .Values.nightly.workDirSize }}}
            - name: tmp
              emptyDir: {sizeLimit: 256Mi}
