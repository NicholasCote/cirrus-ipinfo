{{- $p := .Values.externalSecret.properties -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "ipinfo.fullname" . }}
  labels: {{- include "ipinfo.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.storeRef.kind }}
    name: {{ .Values.externalSecret.storeRef.name }}
  target:
    name: {{ include "ipinfo.fullname" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: '{{ printf "{{ index . %q }}" $p.s3AccessKey }}'
        AWS_SECRET_ACCESS_KEY: '{{ printf "{{ index . %q }}" $p.s3SecretKey }}'
        GRAFANA_TOKEN: '{{ printf "{{ index . %q | default \"\" }}" $p.grafanaToken }}'
        LOKI_DATASOURCE_UID: '{{ printf "{{ index . %q | default \"\" }}" $p.lokiDatasourceUid }}'
        IPINFO_TOKEN: '{{ printf "{{ index . %q | default \"\" }}" $p.ipinfoToken }}'
        MAXMIND_ACCOUNT_ID: '{{ printf "{{ index . %q | default \"\" }}" $p.maxmindAccountId }}'
        MAXMIND_LICENSE_KEY: '{{ printf "{{ index . %q | default \"\" }}" $p.maxmindLicenseKey }}'
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.key }}
