[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cirrus-ipinfo"
version = "0.1.14"
description = "CIRRUS source-IP enrichment: point-in-time ownership/routing/geo records for client IPs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "maxminddb>=2.6",
  "dnspython>=2.6",
  "httpx>=0.27",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "boto3>=1.34",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg-pool>=3.2",
]

[project.scripts]
cirrus-ipinfo = "cirrus_ipinfo.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mmdb-writer>=0.2.5",   # builds fixture MMDBs in tests only
  "netaddr>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cirrus_ipinfo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
